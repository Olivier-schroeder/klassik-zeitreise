<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Schachtel drucken</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    /* Fold-up box (tuck box standing upright) for the cards, black and white, on A3 card.
       Solid line = cut, dashed line = fold. The family drawing comes from private/ (never published). */
    @page { size: A3 portrait; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e6df; font-family: system-ui, sans-serif; color: #111; }
    .controls { padding: 16px; max-width: 297mm; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .controls label { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .controls input { width: 6em; font: inherit; padding: 4px 6px; }
    .controls button { font: 600 16px system-ui, sans-serif; padding: 10px 18px; border-radius: 999px; border: 0; background: #1d2030; color: #fff; cursor: pointer; align-self: flex-start; }
    .info { background: #fff; border-left: 4px solid #3f8f52; padding: 8px 12px; }
    .sheet { width: 297mm; height: 420mm; margin: 0 auto 10mm; background: #fff; page-break-after: always; break-after: page; }
    .sheet svg { width: 297mm; height: 420mm; display: block; }
    @media print { body { background: #fff; } .controls { display: none; } .sheet { margin: 0; } }
  </style>
</head>
<body>
  <div class="controls">
    <strong>Schachtel drucken (A3)</strong>
    <span>Auf <b>A3-Karton</b> drucken (einseitig, 100 % / „Tatsächliche Größe“). Durchgezogene Linien schneiden, gestrichelte Linien falzen (mit Lineal und stumpfem Messerrücken vorritzen), dann die schmale Klebelasche innen an die Vorderseite kleben.</span>
    <label>Dicke von <b>10 Karten</b> in mm (mit dem Lineal messen):
      <input id="t10" type="number" step="0.1" min="1" max="8" value="3.0"></label>
    <div class="info" id="info"></div>
    <button onclick="window.print()">Drucken / als PDF speichern</button>
  </div>
  <div id="sheets"></div>
  <script src="config.js?v=20261109a"></script>
  <script src="common.js?v=20261109a"></script>
  <script>
    (async function () {
      const KZ = window.KZ;
      const PHOTO = "private/familie2_skizze.png";
      const cards = await KZ.loadCards();
      const hasPhoto = await new Promise((res) => { const i = new Image(); i.onload = () => res(true); i.onerror = () => res(false); i.src = PHOTO; });
      const params = new URLSearchParams(location.search);
      const t10Input = document.getElementById("t10");
      if (params.get("t10")) t10Input.value = params.get("t10");

      const SHEET_W = 297, SHEET_H = 420, MARGIN = 8;
      const W = 67;   // inner width/depth: 63 mm cards + room for the card stock walls
      const T = 15;   // tuck tab
      const F = 24;   // dust flap
      const G = 12;   // glue flap

      function render() {
        const t = Math.max(0.1, Number(t10Input.value) / 10 || 0.3);
        const maxL = SHEET_H - 2 * MARGIN - 2 * (W + T);
        // Split into several boxes if one stack would not fit on an A3 sheet.
        let boxes = 1, L;
        for (;;) { L = Math.ceil(cards.length / boxes) * t + 6; if (L <= maxL) break; boxes++; }
        L = Math.round(L);
        document.getElementById("info").innerHTML =
          `${cards.length} Karten × ${t.toFixed(2)} mm ≈ ${Math.round(cards.length * t)} mm Stapel → ` +
          (boxes === 1 ? `<b>eine Schachtel</b> für die 6,3-cm-Karten, innen etwa ${L} mm hoch.` : `<b>${boxes} Schachteln</b> à ${Math.ceil(cards.length / boxes)} Karten (innen ${L} mm hoch).`) +
          (hasPhoto ? "" : " <i>(Familienbild nicht gefunden: Datei private/familie2_skizze.png)</i>");

        const sheets = document.getElementById("sheets");
        sheets.replaceChildren();
        for (let b = 0; b < boxes; b++) sheets.append(sheet(L, boxes > 1 ? `Schachtel ${b + 1} von ${boxes}` : ""));
        window.KZ_BOX_READY = true;
      }

      function sheet(L, label) {
        const netW = 4 * W + G, netH = L + 2 * (W + T);
        const x0 = (SHEET_W - netW) / 2, yb = (SHEET_H - netH) / 2 + W + T; // yb = top edge of the body
        const X = (i) => x0 + i * W;
        const P = (pts) => pts.map((p) => p.map((v) => v.toFixed(2)).join(",")).join(" ");
        const yL = yb + L;

        // Outline (cut), clockwise from the top-left corner of the front panel.
        const outline = [
          [X(0), yb], [X(1), yb],
          [X(1) + 2, yb - F], [X(2) - 2, yb - F], [X(2), yb - 3],              // dust flap (left side)
          [X(2), yb - W], [X(2) + 3, yb - W - T], [X(3) - 3, yb - W - T], [X(3), yb - W], // lid + tuck tab
          [X(3), yb - 3], [X(3) + 2, yb - F], [X(4) - 2, yb - F], [X(4), yb],   // dust flap (right side)
          [X(4) + G, yb + 5], [X(4) + G, yL - 5], [X(4), yL],                   // glue flap
          [X(4) - 2, yL + F], [X(3) + 2, yL + F], [X(3), yL + 3], [X(3), yL],   // bottom dust flap (right)
          [X(2), yL],
          [X(2), yL + 3], [X(2) - 2, yL + F], [X(1) + 2, yL + F], [X(1), yL],   // bottom dust flap (left)
          [X(1), yL + W], [X(1) - 3, yL + W + T], [X(0) + 3, yL + W + T], [X(0), yL + W], // bottom lid + tab
        ];
        const folds = [
          [X(1), yb, X(1), yL], [X(2), yb, X(2), yL], [X(3), yb, X(3), yL], [X(4), yb, X(4), yL],
          [X(1), yb, X(2), yb], [X(2), yb, X(3), yb], [X(2), yb - W, X(3), yb - W], [X(3), yb, X(4), yb],
          [X(1), yL, X(2), yL], [X(0), yL, X(1), yL], [X(0), yL + W, X(1), yL + W], [X(3), yL, X(4), yL],
        ];
        const cx = (i) => X(i) + W / 2;
        const imgH = (W - 4) * 1435 / 2107; // whole group, nobody cut off (drawing is 2107 x 1435 px)
        const midY = yb + L / 2;
        const qrSize = 26;
        // QR code to the game page, drawn as SVG squares.
        const q = qrcode(0, "M"); q.addData(KZ.baseUrl()); q.make();
        const n = q.getModuleCount(), cell = qrSize / n;
        let qrRects = "";
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c))
          qrRects += `<rect x="${(c * cell).toFixed(3)}" y="${(r * cell).toFixed(3)}" width="${(cell + 0.02).toFixed(3)}" height="${(cell + 0.02).toFixed(3)}"/>`;
        const svg = `
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${SHEET_W} ${SHEET_H}">
  <polygon points="${P(outline)}" fill="#fff" stroke="#111" stroke-width="0.35"/>
  ${folds.map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#666" stroke-width="0.3" stroke-dasharray="2 1.5"/>`).join("")}

  <!-- front -->
  <text x="${cx(0)}" y="${yb + 22}" text-anchor="middle" font-family="Georgia, serif" font-size="9.5">Klassik-</text>
  <text x="${cx(0)}" y="${yb + 33}" text-anchor="middle" font-family="Georgia, serif" font-size="9.5">Zeitreise</text>
  <line x1="${X(0) + 14}" y1="${yb + 39}" x2="${X(1) - 14}" y2="${yb + 39}" stroke="#111" stroke-width="0.4"/>
  ${hasPhoto ? `<image href="${PHOTO}" x="${X(0) + 2}" y="${midY - imgH / 2 + 4}" width="${W - 4}" height="${imgH}" preserveAspectRatio="xMidYMid meet"/>` : `<text x="${cx(0)}" y="${midY + 6}" text-anchor="middle" font-family="Georgia, serif" font-size="28">♪</text>`}
  <text x="${cx(0)}" y="${yL - 22}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="3.6" letter-spacing="0.6">DAS MUSIK-ZEITLEISTENSPIEL</text>
  <text x="${cx(0)}" y="${yL - 15}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="3.2" fill="#444">${cards.length} Karten · 1040 bis heute</text>
  ${label ? `<text x="${cx(0)}" y="${yL - 8}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="3" fill="#444">${label}</text>` : ""}

  <!-- sides: title running upwards -->
  ${[1, 3].map((i) => `<text transform="translate(${cx(i) + 2.5} ${midY}) rotate(-90)" text-anchor="middle" font-family="Georgia, serif" font-size="8" letter-spacing="1.5">KLASSIK-ZEITREISE</text>
  <text transform="translate(${cx(i) + 12} ${midY}) rotate(-90)" text-anchor="middle" font-family="Georgia, serif" font-size="9">♪</text>`).join("")}

  <!-- back: short how-to + QR code to the game -->
  <text x="${cx(2)}" y="${yb + 16}" text-anchor="middle" font-family="Georgia, serif" font-size="6">So wird gespielt</text>
  ${["Karte scannen,", "Musik hören,", "an die richtige Stelle", "der Zeitleiste legen,", "umdrehen.", "", "Wer zuerst 10 Karten", "richtig liegen hat,", "gewinnt."].map((s, k) =>
    `<text x="${cx(2)}" y="${yb + 26 + k * 5}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="3.4">${s}</text>`).join("")}
  <g transform="translate(${cx(2) - qrSize / 2} ${yL - qrSize - 18})"><g fill="#111">${qrRects}</g></g>
  <text x="${cx(2)}" y="${yL - 10}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="3">Zum Spiel: scannen</text>

  <!-- lid: ornament (looks right whichever way it is folded) -->
  <circle cx="${cx(2)}" cy="${yb - W / 2}" r="15" fill="none" stroke="#111" stroke-width="0.5"/>
  <circle cx="${cx(2)}" cy="${yb - W / 2}" r="13" fill="none" stroke="#111" stroke-width="0.25"/>
  <text x="${cx(2)}" y="${yb - W / 2 + 5.5}" text-anchor="middle" font-family="Georgia, serif" font-size="16">♪</text>

  <!-- small hints on the glue flap -->
  <text transform="translate(${X(4) + G / 2 + 1.2} ${midY}) rotate(-90)" text-anchor="middle" font-family="system-ui, sans-serif" font-size="2.6" fill="#888">KLEBEN</text>
</svg>`;
        const div = document.createElement("div");
        div.className = "sheet";
        div.innerHTML = svg;
        return div;
      }

      t10Input.addEventListener("input", render);
      render();
    })();
  </script>
</body>
</html>
